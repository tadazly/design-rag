name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: npm ci --ignore-scripts
      - run: npm run verify:release
      - run: npm test
      - run: npm run build:renderer
      - run: npm run plugin:validate
      - run: npm run verify:binary -- dist/native/drag-core.exe

      - name: Verify release runtimes
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          npm run plugin:stage:win
          npm run plugin:stage:mac
          npm run verify:binary -- tests/.tmp/plugin-stage/win32-x64/design-rag-local/plugins/design-rag/bin/drag.exe tests/.tmp/plugin-stage/darwin-arm64/design-rag-local/plugins/design-rag/bin/drag
